<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retro hand — independent motion study</title><link rel="stylesheet" href="frozen-layout.css"><link rel="stylesheet" href="preview.css"></head><body>
<main class="stationery" id="scene">
<header class="identity"><span>HAND STUDY / 02</span><span>INDEPENDENT MOTION PREVIEW</span></header>
<div class="floating-folder floating-one" data-folder="cv" aria-hidden="true"></div><div class="floating-folder floating-two" data-folder="cv" aria-hidden="true"></div><div class="floating-folder floating-three" data-folder="cv" aria-hidden="true"></div><div class="floating-folder floating-four" data-folder="cv" aria-hidden="true"></div><div class="floating-folder floating-five" data-folder="cv" aria-hidden="true"></div>
<div class="focus-composition"><h1 class="title-sticker"><span>hello, here's</span><strong>my<br>cv</strong></h1><div class="main-folder" data-folder="cv" role="img" aria-label="静态 CV 文件夹"></div><div class="folder-caption" aria-hidden="true"><span>01 / 03</span><p>A little about me.<br><span>AI Product Manager / AI Product Operations</span></p></div></div>
<div class="hand-anchor" aria-hidden="true"><div class="hand-actor"></div></div>
<div class="preview-controls"><button id="play" type="button">重播手势 ↻</button><label for="scrub">动作时间</label><input type="range" id="scrub" min="0" max="3400" value="0" step="10" aria-label="预览手势时间轴"><output id="clock">0.00s</output></div>
<div class="preview-note">独立手部试样 · 文件夹保持静态<br><span id="motion-status">一次完整轨迹，无循环</span></div>
</main>
<section class="shape-scene" hidden><header><span>ORIGINAL SVG / LAYERED HAND STUDY</span><h1>Retro swipe hand.</h1><p>完整造型 · 食指 / 黑色指甲 / 拇指 / 掌心 / 弯曲手指 / 印刷颗粒</p></header><img src="retro-hand.svg" alt="原创黄色至橙色卡通手完整 SVG 造型"><footer>手腕为补绘延伸；前景预览时由屏幕底边自然裁切。</footer></section>
